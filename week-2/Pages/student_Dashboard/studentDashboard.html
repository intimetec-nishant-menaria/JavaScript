<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div>
        <h1>Student Dashborad</h1>
    </div>
    <button id="logoutBtn">LogOut</button>
    <div class="main">
        <div class="studentDetails" style="display: flex;align-items: center;flex-direction: column;">
            <section style="color:gold"> Question Not Attempted:<p id="questionsNotAttempted"> </p></section>
            <section style="color:green">Correctly Attempted: <p id="correctlyAttempted"></p></section>
            <section style="color:red"> Wrong  Attempted: <p id="wrongAttempted"></p></section>
            <section> Total  Marks: <p id="totalMarks"></p></section>
        </div>
        <div>
            <button id="quizBtn">
                Start Quiz
            </button>
        </div>
    </div>
    <script src="./index.js"></script>
</body>
</html>
