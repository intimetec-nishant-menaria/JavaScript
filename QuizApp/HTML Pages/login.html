<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>
    <div class="main">
        <form class="login">
            <h1>Welcome To quiz App</h1>
            <h2>Login</h2>
            <input type="email" placeholder="Email" id="email" >
            <input type="password" name="password" id="password" placeholder="password" id="password">
            <div class="buttons">
                <button  id="RegisterBtn">Register User</button>
                <button  id="loginBtn">Let Me In..</button>
            </div>
        </form>
    </div>
    <script src="/QuizApp/dist/auth/login.js" type="module" ></script>
</body>
</html>
