<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>
    <div class="main">
        <form class="login">
    <h1 class="title">Quiz App</h1>
    <form>
        <p class="subtitle">Welcome back, log in to continue</p>

        <input type="email" placeholder="Email address" id="email" required>
        <input type="password" placeholder="Password" id="password" required>

        <div class="buttons">
            <button class="secondary" id="RegisterBtn" type="button">Register</button>
            <button class="primary" id="loginBtn">Log In</button>
        </div>
    </form>

    </div>
    <script src="../dist/auth/login.js" type="module" ></script>
</body>
</html>
